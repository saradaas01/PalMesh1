apply plugin: 'com.android.library'

def hostExtOrDefault(name, fallback) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

android {
    namespace 'com.palmesh.runtime'
    compileSdkVersion hostExtOrDefault('compileSdkVersion', 36)
    defaultConfig {
        minSdkVersion hostExtOrDefault('minSdkVersion', 24)
        targetSdkVersion hostExtOrDefault('targetSdkVersion', 36)
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.facebook.react:react-android'
}
