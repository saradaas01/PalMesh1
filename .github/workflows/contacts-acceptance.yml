name: Offline contacts acceptance
on:
  push:
    branches: ['feat/offline-contact-profiles']
  pull_request:
    paths:
      - 'src/features/contacts/**'
      - 'native/palmesh-runtime/**'
      - 'scripts/android/contacts_smoke.py'
      - '.github/workflows/contacts-acceptance.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: contacts-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  contacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run check
      - run: python3 -m unittest discover -s scripts/android/tests -v
      - name: Verify immutable genuine source artifact provenance
        uses: actions/github-script@v8
        with:
          script: |
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            const {data: run} = await github.rest.actions.getWorkflowRun({...repo, run_id: 40352843627});
            if (run.head_sha !== '84464a5b19387b3f0d0e8bbf1bf425329236ecfd' || run.conclusion !== 'success') throw new Error('Unexpected map producer');
            const {data} = await github.rest.actions.listWorkflowRunArtifacts({...repo, run_id: run.id});
            if (!data.artifacts.some(a => a.id === 12664512510 && a.name === 'palmesh-candidate-palestine-map' && !a.expired)) throw new Error('Pinned genuine map artifact unavailable');
      - uses: actions/download-artifact@v5
        with:
          name: palmesh-candidate-palestine-map
          run-id: 40352843627
          github-token: ${{ github.token }}
          path: mapdata
      - name: Validate the unchanged genuine map and manifest
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'scripts/maps')
          from mbtiles import checked_manifest
          m = checked_manifest(Path('mapdata/palestine.manifest.json'), Path('mapdata/palestine.mbtiles'))
          assert m['sha256'] == '16a88c49eb002bfc4729327bef4629e513f33069532b815c532316738aef06b8'
          assert m['sourceSha256'] == 'bb28f83176b77d1b58701b8e2ebe4b241d37c7871e51f2739a9a684b47c5d44f'
          assert m['dataTimestamp'] == '2026-10-25T21:21:21Z'
          print('Preserved genuine map hash/date/provenance and complete coverage verified.')
          PY
          python3 scripts/maps/package.py
      - uses: ./.github/actions/setup-android
      - name: Install isolated emulator runtime and screenshot analysis dependency
        if: matrix.architecture == 'x86_64'
        run: |
          android --no-metrics --sdk="$ANDROID_HOME" sdk install emulator 'system-images;android-35;default;x86_64'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0 libnss3 libx11-6 libxcb1 libxcomposite1 libxcursor1 libxi6 libxtst6 libxrandr2 libglu1-mesa libasound2t64
          "$ANDROID_HOME/emulator/emulator" -version
          "$ANDROID_HOME/emulator/emulator" -help-gpu
          python3 -m pip install --target "$RUNNER_TEMP/map-test-python" Pillow==12.0.0
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod 600 /dev/kvm
      - name: Build separate contact app with genuine offline maps
        run: |
          python3 scripts/android/gradle.py --bundle-debug --architectures ${{ matrix.architecture }} -PpalmeshContactsTest=true :app:assembleDebug
          python3 scripts/android/verify-apk.py android/app/build/outputs/apk/debug/app-debug.apk --isolated-contacts-test --architectures ${{ matrix.architecture }} --report dist/android/contacts-verification.json
          python3 scripts/android/verify-map-mode.py android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/android/palmesh-contacts-test.apk
      - name: Generate public-only QR acceptance fixture
        if: matrix.architecture == 'x86_64'
        run: node scripts/android/contact-qr-fixture.cjs "$RUNNER_TEMP/contact-fixture"
      - name: Offline QR import, names, encrypted queue and restart acceptance
        if: matrix.architecture == 'x86_64'
        env:
          PYTHONPATH: ${{ runner.temp }}/map-test-python
          PALMESH_CONTACT_FIXTURE: ${{ runner.temp }}/contact-fixture
        run: python3 scripts/android/contacts_smoke.py --contacts-test --gpu swangle --apk android/app/build/outputs/apk/debug/app-debug.apk --output "$RUNNER_TEMP/contact-results" --state "$RUNNER_TEMP/private-contact-emulator"
      - name: Retain the sealed x86 APK for isolated acceptance reruns
        if: always() && matrix.architecture == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: android-contacts-emulator-apk
          path: dist/android/palmesh-contacts-test.apk
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain synthetic acceptance evidence
        if: always() && matrix.architecture == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: offline-contacts-emulator-evidence
          path: ${{ runner.temp }}/contact-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish separately identified ARM64 contact APK
        if: matrix.architecture == 'arm64-v8a'
        uses: actions/upload-artifact@v4
        with:
          name: android-offline-contacts-test-apk
          path: |
            dist/android/palmesh-contacts-test.apk
            dist/android/contacts-verification.json
            mapdata/palestine.manifest.json
          retention-days: 14
