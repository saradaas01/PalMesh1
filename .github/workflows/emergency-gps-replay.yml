name: Replay sealed Emergency Map and GPS acceptance
on:
  push:
    branches: ['feat/emergency-map-gps']
    paths:
      - 'scripts/android/emergency_gps_smoke.py'
      - 'scripts/android/emergency_gps_provider.py'
      - 'scripts/android/smoke.py'
      - 'scripts/android/emergency_smoke.py'
      - '.github/workflows/emergency-gps-replay.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: emergency-gps-sealed-replay
  cancel-in-progress: true
jobs:
  replay:
    if: "${{ startsWith(github.event.head_commit.message, 'test(gps-replay):') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scope: [emergency, emergency_gps]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Refuse stale GPS evidence if relevant application or native source changed
        run: |
          git diff --exit-code 68afa7bb3e5ae9a5362e4e6125b086e58de44ff0 HEAD -- src native android tests/android/emergency-entry.tsx index.js 'package*'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify pinned APK producer and artifact identity
        uses: actions/github-script@v8
        with:
          script: |
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            const {data: run} = await github.rest.actions.getWorkflowRun({...repo, run_id: 40664136371});
            if (run.head_sha !== '68afa7bb3e5ae9a5362e4e6125b086e58de44ff0') throw new Error('Unexpected APK source');
            const {data} = await github.rest.actions.listWorkflowRunArtifacts({...repo, run_id: run.id});
            if (!data.artifacts.some(a => a.id === 12805073922 && a.name === 'android-emergency-synthetic-emulator-apk' && !a.expired)) throw new Error('Pinned sealed APK artifact unavailable');
            console.log('Reusing the sealed current application APK; the original test stopped on an original-report automation lookup before GPS. This matrix records emergency-map and GPS-only scopes separately.');
      - uses: actions/download-artifact@v5
        with:
          artifact-ids: '12805073922'
          run-id: 40664136371
          github-token: ${{ github.token }}
          merge-multiple: true
          path: sealed-apk
      - name: Verify immutable sealed APK bytes
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          apk = Path('sealed-apk/palmesh-emergency-map-test.apk')
          with apk.open('rb') as source:
              assert hashlib.file_digest(source, 'sha256').hexdigest() == 'edd60d53fb59844764bc2170248f24c73b6f0bd41d67a58d2ff304a37722292b'
      - uses: ./.github/actions/setup-android
      - name: Install isolated emulator runtime and screenshot analysis dependency
        run: |
          android --no-metrics --sdk="$ANDROID_HOME" sdk install emulator 'system-images;android-35;default;x86_64'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0 libnss3 libx11-6 libxcb1 libxcomposite1 libxcursor1 libxi6 libxtst6 libxrandr2 libglu1-mesa libasound2t64
          "$ANDROID_HOME/emulator/emulator" -version
          "$ANDROID_HOME/emulator/emulator" -help-gpu
          python3 -m pip install --target "$RUNNER_TEMP/map-test-python" Pillow==12.0.0
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod 600 /dev/kvm
      - name: Verify isolated synthetic packaging and diagnostic map mode
        run: |
          python3 scripts/android/verify-apk.py sealed-apk/palmesh-emergency-map-test.apk --isolated-emergency-test --synthetic-emergency-fixture --architectures x86_64 --report sealed-apk/verification.json
          python3 scripts/android/verify-map-mode.py sealed-apk/palmesh-emergency-map-test.apk --enabled
      - name: Exercise the selected offline acceptance scope
        env:
          PYTHONPATH: ${{ runner.temp }}/map-test-python
        run: python3 scripts/android/${{ matrix.scope }}_smoke.py --emergency-test --gpu swangle --apk sealed-apk/palmesh-emergency-map-test.apk --output "$RUNNER_TEMP/emergency-gps-results" --state "$RUNNER_TEMP/private-emergency-gps-emulator"
      - name: Retain targeted GPS replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-${{ matrix.scope }}-sealed-replay-evidence
          path: |
            ${{ runner.temp }}/emergency-gps-results/
            sealed-apk/verification.json
          if-no-files-found: ignore
          retention-days: 14
