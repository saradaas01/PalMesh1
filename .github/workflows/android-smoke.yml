name: Android offline cold launch
on:
  workflow_dispatch:
  push:
    branches: [main, work]
    paths:
      - 'android/**'
      - 'native/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/android/smoke.py'
      - 'scripts/android/tests/test_smoke.py'
      - '.github/actions/setup-android/**'
      - '.github/workflows/android-smoke.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'native/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/android/smoke.py'
      - 'scripts/android/tests/test_smoke.py'
      - '.github/actions/setup-android/**'
      - '.github/workflows/android-smoke.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  offline-startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - uses: ./.github/actions/setup-android
      - name: Install the official emulator and AOSP system image
        shell: bash
        run: |
          android --no-metrics --sdk="$ANDROID_HOME" sdk install \
            emulator 'system-images;android-35;default;x86_64'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpulse0 libnss3 libx11-6 libxcb1 libxcomposite1 libxcursor1 \
            libxi6 libxtst6 libxrandr2 libglu1-mesa libasound2t64
      - name: Require hardware virtualization for the isolated test
        shell: bash
        run: |
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod 600 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
      - run: python3 scripts/maps/package.py --fonts-only
      - run: python3 scripts/android/gradle.py --bundle-debug --architectures x86_64 :app:assembleDebug
      - run: python3 scripts/android/verify-apk.py android/app/build/outputs/apk/debug/app-debug.apk --require-bundle --architectures x86_64
      - name: Test real offline startup and local persistence
        run: >-
          python3 scripts/android/smoke.py
          --apk android/app/build/outputs/apk/debug/app-debug.apk
          --output "$RUNNER_TEMP/palmesh-smoke-results"
          --state "$RUNNER_TEMP/palmesh-private-emulator"
      - name: Surface a bounded failure summary
        if: failure()
        shell: python
        run: |
          import json, os
          from pathlib import Path
          report = Path(os.environ['RUNNER_TEMP']) / 'palmesh-smoke-results/smoke-report.json'
          if report.is_file():
              failure = str(json.loads(report.read_text()).get('failure', 'Inspect the retained smoke diagnostics.'))[:500]
              failure = failure.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Android offline startup::' + failure)
      - name: Retain synthetic emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-offline-smoke-diagnostics
          path: ${{ runner.temp }}/palmesh-smoke-results/
          if-no-files-found: ignore
          retention-days: 7
