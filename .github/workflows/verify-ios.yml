name: Verify iOS host on macOS
on:
  workflow_dispatch:
  push:
    branches: [main, work]
    paths:
      - 'ios/**'
      - 'native/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify-ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'native/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify-ios.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  simulator-build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios
      - run: npm ci
      - run: python3 scripts/maps/package.py --fonts-only
      - run: bundle exec pod install 2>&1 | tee "$RUNNER_TEMP/palmesh-pods.log"
        shell: bash
        working-directory: ios
      - name: Compile simulator host without distribution credentials
        shell: bash
        run: |
          xcodebuild -workspace ios/PalMesh.xcworkspace -scheme PalMesh \
          -configuration Release -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath "$RUNNER_TEMP/PalMeshDerivedData" \
          -resultBundlePath "$RUNNER_TEMP/PalMeshBuild.xcresult" \
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 \
          | tee "$RUNNER_TEMP/palmesh-xcodebuild.log"
      - name: Surface failed native build diagnostics
        if: failure()
        shell: python
        run: |
          import os
          from pathlib import Path
          import re

          # Run annotations remain readable even when downloading the retained
          # full logs requires sign-in. Keep them bounded and escape workflow
          # control characters before printing compiler-supplied text.
          failure = re.compile(r'error:|fatal error|undefined symbols|could not|unable to|no such module|not found|build failed|\[!\]', re.IGNORECASE)
          root = Path(os.environ['RUNNER_TEMP'])
          names = ('palmesh-xcodebuild.log',) if (root / 'palmesh-xcodebuild.log').is_file() else ('palmesh-pods.log',)
          for name in names:
              path = root / name
              if not path.is_file():
                  continue
              lines = [line.strip() for line in path.read_text(errors='replace').splitlines() if line.strip()]
              selected = [line for line in lines if failure.search(line)]
              if not selected:
                  selected = ['The failed build produced no recognized error lines; inspect the retained diagnostics artifact.']
              elif len(selected) > 30:
                  selected = selected[:15] + selected[-15:]
              for line in selected:
                  message = (name + ': ' + line)[:1800]
                  message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error title=iOS native build diagnostics::' + message)
      - name: Retain native compile diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-compile-diagnostics
          path: |
            ${{ runner.temp }}/palmesh-pods.log
            ${{ runner.temp }}/palmesh-xcodebuild.log
            ${{ runner.temp }}/PalMeshBuild.xcresult
          if-no-files-found: ignore
          retention-days: 7
