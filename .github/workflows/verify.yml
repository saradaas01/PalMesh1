name: Verify PalMesh
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: python3 -m unittest discover -s scripts/android/tests -v
      - run: python3 -m unittest discover -s scripts/maps/tests -v
      - run: python3 scripts/maps/package.py --fonts-only --check
      - run: npm run bundle:android
      - uses: actions/upload-artifact@v4
        with:
          name: android-javascript-bundle
          path: dist/android
          retention-days: 14
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0' 'ndk;27.1.12297006' 'cmake;3.30.5'
      - run: python3 scripts/maps/package.py --fonts-only
      - run: python3 scripts/android/gradle.py --bundle-debug :app:assembleDebug
      - run: python3 scripts/android/verify-apk.py android/app/build/outputs/apk/debug/app-debug.apk --require-bundle --report dist/android/debug-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: android-development-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            dist/android/debug-verification.json
          retention-days: 14
